<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Go2 Navigation</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo-dot"></span>
      <span class="brand-name">GO2</span>
      <span class="brand-sub">Navigation Console</span>
    </div>
    <div class="conn">
      <span id="statusDot" class="status-dot"></span>
      <span id="statusText" class="status-text">connecting...</span>
    </div>
  </header>

  <main class="layout">
    <section class="map-panel">
      <div class="map-head">
        <h2>Live Map</h2>
        <div class="map-legend">
          <span><i class="sw sw-free"></i> free</span>
          <span><i class="sw sw-occ"></i> wall</span>
          <span><i class="sw sw-robot"></i> robot</span>
          <span><i class="sw sw-room"></i> room</span>
        </div>
      </div>
      <div class="canvas-wrap">
        <canvas id="map"></canvas>
        <div id="mapEmpty" class="map-empty">Waiting for map. Drive the robot to build it.</div>
      </div>
      <div class="map-foot">
        <span id="poseReadout" class="pose-readout">pose --</span>
      </div>
    </section>

    <aside class="side-panel">
      <div class="card">
        <div class="card-title">Rooms</div>
        <div id="rooms" class="room-list">
          <div class="muted">No rooms recorded yet.</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Record a room here</div>
        <div class="record-row">
          <input id="roomName" type="text" placeholder="e.g. kitchen" maxlength="24" />
          <button id="recordBtn" class="btn btn-ghost">Record</button>
        </div>
      </div>

      <div class="card status-card">
        <div class="card-title">Status</div>
        <div class="status-lines">
          <div><span class="k">Pose</span><span id="stPose" class="v">--</span></div>
          <div><span class="k">Map</span><span id="stMap" class="v">--</span></div>
          <div><span class="k">Nav</span><span id="stNav" class="v">idle</span></div>
        </div>
        <div id="lastResult" class="last-result">ready</div>
      </div>

      <button id="stopBtn" class="btn btn-stop">STOP</button>
    </aside>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
